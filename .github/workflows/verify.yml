name: Vérifier DocSpace
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t docspace-test .
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot et ses modèles officiels
        run: |
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Vérifier et exporter le jeu
        run: |
          mkdir -p public/games/orbit-garden
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/orbit-garden --editor --import
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot/orbit-garden --export-release Web
          test -s public/games/orbit-garden/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-garden-web
          path: public/games/orbit-garden/
          retention-days: 14
