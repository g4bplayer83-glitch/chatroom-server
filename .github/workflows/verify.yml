name: Vérifier DocSpace
on:
  pull_request:
  push:
    branches: [main, codex/docspace-3.5-mobile]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Préparer les outils officiels pour les exports
        run: |
          mkdir -p toolchain
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o toolchain/godot.zip
          curl --fail --location --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -j -q /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.4.1-toolchain
          path: toolchain/
          retention-days: 7
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
