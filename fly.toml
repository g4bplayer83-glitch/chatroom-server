app = "docspace"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  DATA_DIR = "/data/data"
  UPLOAD_DIR = "/data/uploads"
  DOCSPACE_SELF_KEEPALIVE = "false"
  DOCSPACE_VOICE_MODE = "p2p"
  DOCSPACE_STUN_URLS = "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 180
    hard_limit = 260

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "15s"
    method = "GET"
    path = "/health-lite"

[[mounts]]
  source = "docspace_data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
